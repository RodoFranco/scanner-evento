<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Escáner de Acceso</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#111827;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{width:min(520px,100%);background:#fff;color:#111827;border-radius:18px;padding:28px;box-shadow:0 15px 45px rgba(0,0,0,.28);text-align:center}
    h1{margin:0 0 10px;font-size:28px}
    p{line-height:1.5;color:#475467}
    .btn{display:block;width:100%;padding:16px;margin-top:20px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer}
    .note{font-size:13px;margin-top:16px}
    .spinner{width:34px;height:34px;border:4px solid #e5e7eb;border-top-color:#111827;border-radius:50%;margin:20px auto;animation:g 1s linear infinite}
    @keyframes g{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>ESCÁNER DE ACCESO</h1>
    <p>Abriendo el escáner oficial del evento...</p>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbzGEu4dyhLJlj21sLxelVucV7eSW6dI1ALSGVOl6vqQGCqK5yv2MGCopdNb9hFdmpHo/exec?page=scanner">ABRIR ESCÁNER</a>
    <p class="note">Si la apertura automática no funciona, pulsa el botón.</p>
  </main>
  <script>
    const scannerUrl = 'https://script.google.com/macros/s/AKfycbzGEu4dyhLJlj21sLxelVucV7eSW6dI1ALSGVOl6vqQGCqK5yv2MGCopdNb9hFdmpHo/exec' + "?page=scanner";
    setTimeout(() => {
      window.location.replace(scannerUrl);
    }, 700);
  </script>
</body>
</html>
